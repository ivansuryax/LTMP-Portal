services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ltmp
      POSTGRES_USER: ltmp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ltmp -d ltmp"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: '5432'
      POSTGRES_DB: ltmp
      POSTGRES_USER: ltmp
      # Pass the raw secret. SQLAlchemy URL.create() escapes reserved characters.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FRONTEND_ORIGIN: http://localhost:5173
    command: >-
      sh -c 'if [ -f /imports/LTMP.xlsx ]; then python scripts/import_excel.py --file /imports/LTMP.xlsx --if-empty || exit 1; fi; python scripts/repair_identifiers.py || exit 1; python scripts/backfill_assignment_notifications.py || exit 1; python scripts/backfill_external_assignments.py || exit 1; exec uvicorn app.main:app --host 0.0.0.0 --port 8000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - ./imports:/imports:ro
  web:
    build: ./frontend
    ports: ["127.0.0.1:5173:80"]
    depends_on:
      api:
        condition: service_healthy
volumes:
  pgdata:

